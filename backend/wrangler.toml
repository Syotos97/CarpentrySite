name = "carpentry-invoice-backend"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Non-secret configuration. Update these for your shop before deploying.
[vars]
SHOP_ORIGIN = "https://brianscustomcarpentry.com"
WORKER_BASE_URL = "https://carpentry-invoice-backend.brianscustomcarpentry.workers.dev"
FROM_EMAIL = "Brian's Custom Carpentry <orders@brianscustomcarpentry.com>"
ADMIN_EMAIL = "bmalbert997@gmail.com"
BUSINESS_NAME = "Brian's Custom Carpentry"
PAYPAL_LINK = "https://paypal.me/briancustomcarpentry"
VENMO_HANDLE = "@Brian-Albert-35"
ZELLE_CONTACT = "7085151012"
# Keep this comfortably under R2's 10GB/month free tier so sketch uploads never risk a charge.
R2_STORAGE_CAP_BYTES = "9000000000"

# Secrets (do NOT put real values here). Set with:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ADMIN_MASTER_KEY
# RESEND_API_KEY  - API key from https://resend.com
# ADMIN_MASTER_KEY - a long random string you choose, used to view the admin order log

[[d1_databases]]
binding = "DB"
database_name = "carpentry-invoices"
database_id = "74ac608c-3b48-48e8-8af5-aee19119030b"

[[r2_buckets]]
binding = "SKETCHES"
bucket_name = "carpentry-invoice-sketches"
